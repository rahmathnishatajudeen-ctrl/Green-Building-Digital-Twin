[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "green-building-vision"
version = "0.1.0"
description = "Privacy-conscious room occupancy observations for a building digital twin"
requires-python = ">=3.10"
dependencies = ["ultralytics>=8.3,<9", "opencv-python>=4.10,<5", "numpy>=1.24,<3"]

[project.optional-dependencies]
twin = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
ai = ["openai>=1.50,<3"]
test = ["httpx>=0.27,<1"]

[project.scripts]
gbdt-vision = "gbdt_vision.cli:main"
gbdt-twin = "gbdt_vision.twin_server:main"

[tool.setuptools.packages.find]
include = ["gbdt_vision*"]

[tool.setuptools.package-data]
gbdt_vision = ["static/*"]